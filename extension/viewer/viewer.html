<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fiche société | Company Form Filler</title>
    <link rel="icon" href="../icons/icon-32.png" />
    <link rel="stylesheet" href="../shared/theme.css" />
    <link rel="stylesheet" href="viewer.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <img src="../icons/icon-32.png" alt="" width="20" height="20" />
        <span data-i18n="extName"></span>
      </div>
      <div class="title">
        <h1 id="company-name"></h1>
        <span class="badge" id="company-form"></span>
      </div>
      <div class="actions">
        <button type="button" class="btn btn-primary" id="new-company"></button>
        <button type="button" class="btn" id="favorite" aria-pressed="false"></button>
        <button type="button" class="btn" id="theme"></button>
      </div>
    </header>

    <div class="messages">
      <p class="notice" data-i18n="viewerWarning"></p>
      <p class="error" id="storage-error" hidden data-i18n="storageError"></p>
      <section class="onboarding" id="onboarding" hidden aria-labelledby="onboarding-title">
        <h2 id="onboarding-title" data-i18n="onboardingTitle"></h2>
        <ol>
          <li data-i18n="onboarding1"></li>
          <li data-i18n="onboarding2"></li>
          <li data-i18n="onboarding3"></li>
        </ol>
        <button
          type="button"
          class="btn"
          id="onboarding-close"
          data-i18n="onboardingClose"
        ></button>
      </section>
    </div>

    <div class="layout">
      <main class="sheet" id="sheet" aria-live="polite"></main>

      <aside class="side">
        <div class="tabs" role="tablist">
          <button
            type="button"
            role="tab"
            class="tab"
            id="tab-history"
            aria-controls="panel-history"
            aria-selected="true"
            data-i18n="viewerHistory"
          ></button>
          <button
            type="button"
            role="tab"
            class="tab"
            id="tab-favorites"
            aria-controls="panel-favorites"
            aria-selected="false"
            data-i18n="viewerFavorites"
          ></button>
        </div>
        <section id="panel-history" role="tabpanel" aria-labelledby="tab-history">
          <ul class="list" id="history-list"></ul>
        </section>
        <section id="panel-favorites" role="tabpanel" aria-labelledby="tab-favorites" hidden>
          <ul class="list" id="favorites-list"></ul>
        </section>
        <div class="side-actions">
          <button
            type="button"
            class="btn"
            id="clear-history"
            data-i18n="viewerClearHistory"
          ></button>
          <button
            type="button"
            class="btn btn-danger"
            id="clear-all"
            data-i18n="viewerClearAll"
          ></button>
        </div>
        <div class="confirm" id="confirm" hidden role="alertdialog" aria-labelledby="confirm-text">
          <p id="confirm-text" data-i18n="viewerConfirmClearAll"></p>
          <div class="confirm-actions">
            <button
              type="button"
              class="btn btn-danger"
              id="confirm-yes"
              data-i18n="viewerConfirm"
            ></button>
            <button type="button" class="btn" id="confirm-no" data-i18n="viewerCancel"></button>
          </div>
        </div>
      </aside>
    </div>
    <p class="visually-hidden" id="status" role="status" aria-live="polite"></p>

    <script src="../shared/format.js"></script>
    <script src="../shared/page.js"></script>
    <script src="viewer.js"></script>
  </body>
</html>
